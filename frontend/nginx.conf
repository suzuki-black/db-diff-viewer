# ==============================================================
# HTTPS（TLS 終端・ポート 443）
# 証明書は docker-entrypoint.sh が /etc/nginx/ssl/ に配置する
# ==============================================================
server {
    listen 443 ssl;
    server_name _;

    # ---- TLS 証明書 ----
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # ---- TLS プロトコル・暗号スイート（Mozilla Intermediate 準拠） ----
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    # HSTS（本番環境で HTTPS を強制する場合は有効化を推奨）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 圧縮
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # Docker内部DNSリゾルバー（127.0.0.11）を使用し、バックエンドのIPを動的に再解決する
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API リクエストをバックエンドにプロキシ
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout    300;
        proxy_connect_timeout 300;
    }

    # SPA フォールバック（React Router 対応）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静的アセットのキャッシュ設定
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
