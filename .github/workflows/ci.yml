name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================================
  # フロントエンド: 型チェック・Lint・ビルド
  # ============================================================
  frontend:
    name: Frontend (TypeScript + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: TypeScript 型チェック
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================================
  # バックエンド: Lint・型チェック
  # ============================================================
  backend:
    name: Backend (Python + FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff mypy types-PyMySQL

      - name: Ruff Lint
        run: ruff check .

      - name: Ruff Format check
        run: ruff format --check .

      - name: mypy 型チェック
        run: mypy . --ignore-missing-imports --exclude 'tests/'

      - name: pytest（ユニットテスト）
        run: pytest tests/ -v --tb=short

  # ============================================================
  # Docker Compose: ビルド確認
  # ============================================================
  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env from example
        run: cp .env.example .env

      - name: Docker Compose build (production)
        run: docker compose build --no-cache

      - name: Docker Compose up (smoke test)
        run: |
          docker compose up -d
          # ヘルスチェックが通るまで最大60秒待機
          timeout 60 bash -c 'until curl -sf http://localhost:3000 && curl -sf http://localhost:8000/api/health; do sleep 3; done'
          echo "Smoke test passed"
          docker compose down
